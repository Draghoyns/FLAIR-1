# command : 
#flair-detect --conf=/media/DATA/INFERENCE_HS/DATA/dataset_zone_last/inference_flair/config_detect_compare_metrics.yaml -c -m -b --onnx
# default "production" : batch mode

#### OPTIMIZATION
onnx: false
opti_config: ./configs/opti_config.yaml # path to optimization method config file
save_opti_model: False

log_verbose: false
save_inference: true # save inference results

#### OUTPUT
output_path: ./0testing_saves/out20250804
output_name: D037_2021_UU_S1_4_IRC-ARGMAX-S # stem
output_type: argmax # prediction type

#### INPUT AND GROUND TRUTH
data_type: IRC # IR, IRC, RVB, RVBI, RVBIE
input_root: /media/stores/tmp/store-DAI/pocs/INFERENCE_SH/DATA/ortho # + dpt + zone
input_img_path: /media/stores/tmp/store-DAI/pocs/INFERENCE_SH/DATA/ortho/D037_2021/UU_S1_4/037_2021_UU_S1_4_IRC.tif
input_path : /media/stores/tmp/store-DAI/pocs/INFERENCE_SH/DATA/ortho/D037_2021 # optional - directory if multiple inputs

truth_root: /media/stores/tmp/store-DAI/pocs/INFERENCE_SH/DATA/labels_raster/FLAIR19 # + dpt + zone
truth_path : /media/stores/tmp/store-DAI/pocs/INFERENCE_SH/DATA/labels_raster/FLAIR19/D037_2021/UU_S1_4/D037_2021-UU_S1_4-MSK_FLAIR19-LABEL.tif

#### PARAMETERS
channels: [1, 2, 3, ] 
img_pixels_detection: 512 # best for swin
margin: 0 # for clipping at stitching time

#### MODEL
model_weights: /media/stores/tmp/store-DAI/pocs/INFERENCE_SH/MODELS_IA/FLAIR1/swin-upernet-small_IRV_SET1/checkpoints/ckpt-epoch=84-val_loss=0.37_00_HF_SwinUpernet_Small_IR-R-G_set1.ckpt
model_framework: 
    model_provider: HuggingFace 
    
    HuggingFace:
        org_model: openmmlab/upernet-swin-small
    SegmentationModelsPytorch:
        encoder_decoder: resnet34_unet

model_name: upernet-swin-small
encoder_name: swin-small

batch_size:  2 # for DataLoader
use_gpu: true 
num_worker: 8

#### NORMALIZATION
norma_task:
- norm_type: custom
  norm_means: [106.38, 105.08, 110.87]
  norm_stds: [39.69, 52.17, 45.38]

#### COMPARISON PARAMETERS
  # only if --compare when calling flair-detect

# used to ensure coherence between tiling and stitching parameters
overlap_strat : False # False for exact clipping, True if overlap is handled

strategies:
  tiling: # tiling handles different sizes 
    enabled: False
    size_range : [512] # replaces img_pixels_detection
    stride_range : [0.75] # percentage of the tile size - should be related to margin if stitching requires clipping

  stitching : # overlap is determined by tiling
    enabled : False
    methods : [exact-clipping] #[average, average_weights, max, exact-clipping] # max = max confidence
    margin : [0., 0.125] # percentage of the tile size (float) TODO: add option to use pixels

#### CLASSES
n_classes: 19
classes: # k = value in MSK : v = [weight, name]
    1:  [1, 'building']
    2:  [1, 'pervious surface']
    3:  [1, 'impervious surface']
    4:  [1, 'bare soil']
    5:  [1, 'water']
    6:  [1, 'coniferous']
    7:  [1, 'deciduous']
    8:  [1, 'brushwood']
    9:  [1, 'vineyard']
    10: [1, 'herbaceous vegetation']
    11: [1, 'agricultural land']
    12: [1, 'plowed land']
    13: [1, 'swimming_pool']
    14: [1, 'snow']
    15: [0, 'clear cut']
    16: [0, 'mixed']
    17: [0, 'ligneous']
    18: [1, 'greenhouse']
    19: [0, 'other']
